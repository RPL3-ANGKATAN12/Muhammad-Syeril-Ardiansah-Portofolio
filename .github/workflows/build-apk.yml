name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" "build-tools;36.0.0" || true

      - name: Install Dependencies
        run: npm install

      - name: Build Web Assets (Vue + Vite)
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Grant Execute Permission to Gradle
        run: chmod +x android/gradlew

      - name: Build Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace

      - name: Prepare APK for Release
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Syeril-Portofolio.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Syeril-Portfolio-APK
          path: Syeril-Portofolio.apk
          retention-days: 14

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: "v1.0.0 - M. Syeril Portfolio Mobile App"
          body: |
            ## 📱 M. Syeril Portfolio - Android App (APK)

            Aplikasi portofolio interaktif dengan animasi 3D Three.js "Syeril", dibangun menggunakan Vue 3 dan Capacitor.

            ### 📥 Cara Pasang di HP:
            1. Klik dan download file **`Syeril-Portofolio.apk`** di bawah.
            2. Buka file `.apk` di HP Android kamu.
            3. Pilih **Install** (izinkan instalasi dari browser jika diminta).
            4. Buka aplikasinya dan nikmati tampilan 3D-nya! ✨
          files: Syeril-Portofolio.apk
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
